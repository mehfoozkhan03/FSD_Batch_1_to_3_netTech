<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>block and inline element's</title>
    <style>
        .red{
            background: red;
            padding:.3rem 0 ;
        }
        .orange{
            background: orangered;
            padding:.3rem 0 ;
        }

        span,q{
            background: green;
            padding:.3rem 0 ;
        }
    </style>
  </head>
  <body>
    <!-- block element's -->

    <div class="red">1. block element's</div>
    <div class="orange"> orange</div>
    <h1>block element</h1>
    <p>ndnnrgfg</p>

    <br>
    <!-- inline element's -->

    <span>inline element's</span>

    <q>hello fjkdbvdfbvdfbvdfbvbdfvbdbvfdbvfvb</q>

  </body>
</html>
